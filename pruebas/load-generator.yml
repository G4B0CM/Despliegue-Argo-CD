# Generador de carga para la prueba del HPA (no lo gestiona Argo CD: está fuera de k8s/).
# Aplicar:  kubectl apply -f pruebas/load-generator.yml
# Quitar:   kubectl delete -f pruebas/load-generator.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -O- http://web-app-service > /dev/null; done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
