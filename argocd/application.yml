apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/G4B0CM/Despliegue-Argo-CD.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: web-app
  syncPolicy:
    automated:
      prune: true     # borra del clúster lo que se elimine del repo
      selfHeal: true  # revierte cambios manuales hechos fuera de Git
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # El HPA es dueño del número de réplicas: Argo CD no lo compara ni lo revierte.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: web-app
      jsonPointers:
        - /spec/replicas
